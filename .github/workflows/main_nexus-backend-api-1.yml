name: Build and deploy Python app to Azure Web App - nexus-backend-api-1

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies locally
        run: |
          cd backend
          # تحميل المكتبات مباشرة داخل فولدر مخصص بدل الـ venv
          pip install --target=".python_packages/lib/site-packages" -r requirements.txt
          
      - name: Zip the application
        run: |
          cd backend
          # ضغط الملفات بالكامل في ثانية واحدة
          zip -r ../release.zip ./*

      - name: Deploy to Azure
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'nexus-backend-api-1'
          publish-profile: ${{ secrets.AZUREAPPSERVICE_PUBLISHPROFILE_FCABD260C975420DA020F18432FC62AC }}
          package: release.zip